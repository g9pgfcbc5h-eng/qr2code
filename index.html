<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background-color: #34c759;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        #start-button:active {
            transform: scale(0.96);
        }

        #error-log {
            color: #ff3b30;
            margin-top: 20px;
            font-size: 14px;
            max-width: 90%;
            word-wrap: break-word;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        #scan-hint {
            position: absolute;
            top: 50px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: center;
            pointer-events: none;
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        #barcode {
            width: 90%;
            max-height: 75%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 15px;
            color: #666666;
            text-align: center;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h2 style="margin-bottom: 8px;">QR Сканер</h2>
        <p style="color: #aaa; margin: 0;">Сканер с визуальным прицелом</p>
        <button id="start-button">Включить камеру</button>
        <div id="error-log"></div>
    </div>

    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        <div id="scan-hint">Наведите камеру на QR-код</div>
    </div>

    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let stream = null;
        let isScanning = false;
        let isProcessing = false;

        const processCanvas = document.createElement('canvas');
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });

        const overlayCanvas = document.getElementById('overlay');
        const overlayCtx = overlayCanvas.getContext('2d');

        let nativeDetector = null;
        if ('BarcodeDetector' in window) {
            try {
                nativeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            } catch (e) {}
        }

        const videoElement = document.getElementById('video');
        const startScreen = document.getElementById('start-screen');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');
        const errorLog = document.getElementById('error-log');
        const instructionText = document.getElementById('instruction');

        document.getElementById('start-button').addEventListener('click', () => {
            errorLog.innerText = "";
            startCamera();
        });

        async function startCamera() {
            stopCamera();

            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", "true");

                await videoElement.play();

                startScreen.style.display = 'none';
                scannerContainer.style.display = 'flex';

                isScanning = true;
                isProcessing = false;
                requestAnimationFrame(scanFrame);

            } catch (error) {
                console.error("Ошибка камеры:", error);
                errorLog.innerText = "Ошибка запуска камеры: " + (error.message || error.name);
                startScreen.style.display = 'flex';
                scannerContainer.style.display = 'none';
            }
        }

        function stopCamera() {
            isScanning = false;
            if (overlayCtx) {
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoElement.srcObject = null;
        }

        // Отрисовка подсвечивающей рамки поверх QR-кода
        function drawHighlightBox(points, videoW, videoH) {
            const containerW = scannerContainer.clientWidth;
            const containerH = scannerContainer.clientHeight;

            overlayCanvas.width = containerW;
            overlayCanvas.height = containerH;

            overlayCtx.clearRect(0, 0, containerW, containerH);

            // Расчет масштабирования с учетом object-fit: cover
            const videoRatio = videoW / videoH;
            const containerRatio = containerW / containerH;

            let renderW, renderH, offsetX, offsetY;

            if (containerRatio > videoRatio) {
                renderW = containerW;
                renderH = containerW / videoRatio;
                offsetX = 0;
                offsetY = (containerH - renderH) / 2;
            } else {
                renderH = containerH;
                renderW = containerH * videoRatio;
                offsetX = (containerW - renderW) / 2;
                offsetY = 0;
            }

            const mapX = (x) => offsetX + (x / videoW) * renderW;
            const mapY = (y) => offsetY + (y / videoH) * renderH;

            overlayCtx.beginPath();
            overlayCtx.moveTo(mapX(points[0].x), mapY(points[0].y));
            for (let i = 1; i < points.length; i++) {
                overlayCtx.lineTo(mapX(points[i].x), mapY(points[i].y));
            }
            overlayCtx.closePath();

            overlayCtx.lineWidth = 5;
            overlayCtx.strokeStyle = '#00FF66';
            overlayCtx.fillStyle = 'rgba(0, 255, 102, 0.35)';
            overlayCtx.stroke();
            overlayCtx.fill();
        }

        async function scanFrame() {
            if (!isScanning) return;

            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA && !isProcessing) {
                isProcessing = true;
                let foundText = null;
                let pointsToDraw = null;
                let srcW = videoElement.videoWidth;
                let srcH = videoElement.videoHeight;

                // 1. Попытка через нативный модуль Apple
                if (nativeDetector) {
                    try {
                        const barcodes = await nativeDetector.detect(videoElement);
                        if (barcodes.length > 0) {
                            foundText = barcodes[0].rawValue;
                            if (barcodes[0].cornerPoints) {
                                pointsToDraw = barcodes[0].cornerPoints;
                            }
                        }
                    } catch (e) {}
                }

                // 2. Попытка через jsQR
                if (!foundText) {
                    const targetWidth = 800; // Оптимальное разрешение для мелких кодов
                    let scale = targetWidth / srcW;
                    let w = targetWidth;
                    let h = Math.round(srcH * scale);

                    if (processCanvas.width !== w || processCanvas.height !== h) {
                        processCanvas.width = w;
                        processCanvas.height = h;
                    }

                    processCtx.drawImage(videoElement, 0, 0, w, h);
                    const imageData = processCtx.getImageData(0, 0, w, h);

                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert"
                    });

                    if (code && code.data) {
                        foundText = code.data;
                        if (code.location) {
                            // Пересчитываем координаты со сжатого холста обратно в исходный размер видео
                            const unscaleX = srcW / w;
                            const unscaleY = srcH / h;
                            pointsToDraw = [
                                { x: code.location.topLeftCorner.x * unscaleX, y: code.location.topLeftCorner.y * unscaleY },
                                { x: code.location.topRightCorner.x * unscaleX, y: code.location.topRightCorner.y * unscaleY },
                                { x: code.location.bottomRightCorner.x * unscaleX, y: code.location.bottomRightCorner.y * unscaleY },
                                { x: code.location.bottomLeftCorner.x * unscaleX, y: code.location.bottomLeftCorner.y * unscaleY }
                            ];
                        }
                    }
                }

                if (foundText && isScanning) {
                    // Рисуем подсвечивающий квадрат
                    if (pointsToDraw) {
                        drawHighlightBox(pointsToDraw, srcW, srcH);
                    }
                    
                    // Виброотклик
                    if (navigator.vibrate) {
                        navigator.vibrate(100);
                    }

                    // Задержка 250 мс, чтобы пользователь визуально засек вспышку зеленой рамки
                    setTimeout(() => {
                        handleCodeFound(foundText);
                    }, 250);
                    return;
                }

                isProcessing = false;
            }

            if (isScanning) {
                requestAnimationFrame(scanFrame);
            }
        }

        function handleCodeFound(rawText) {
            let extractedCode = rawText;

            if (rawText.includes(';')) {
                const parts = rawText.split(';');
                if (parts.length >= 2) {
                    extractedCode = parts[1];
                }
            }

            stopCamera();
            showBarcodeResult(extractedCode);
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            try {
                JsBarcode("#barcode", codeText, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 22,
                    margin: 10,
                    width: 3,
                    height: 140,
                    background: "#ffffff",
                    lineColor: "#000000"
                });
            } catch (e) {
                document.getElementById('barcode').innerHTML = '';
                instructionText.innerText = "Ошибка генерации Code128.\nСчитанный текст: " + codeText + "\n\nКоснитесь для нового сканирования.";
                instructionText.style.color = "#ff3b30";
                instructionText.style.fontWeight = "bold";
            }
        }

        // Повторный запуск по тапу
        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            document.getElementById('barcode').innerHTML = '';

            instructionText.innerText = 'Коснитесь экрана для нового сканирования';
            instructionText.style.color = '#666666';
            instructionText.style.fontWeight = "normal";

            startCamera();
        });

        // Пауза при сворачивании
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else {
                if (resultContainer.style.display !== 'flex' && startScreen.style.display === 'none') {
                    startCamera();
                }
            }
        });
    </script>
</body>
</html>
