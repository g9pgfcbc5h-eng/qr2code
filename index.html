<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #error-log {
            color: #ff4444;
            margin-top: 20px;
            font-size: 14px;
            max-width: 90%;
            word-wrap: break-word;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Визуальная рамка для помощи с фокусировкой */
        #aim-box {
            width: 260px;
            height: 260px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5); /* Затемнение фона вокруг */
            position: absolute;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #aim-box::after {
            content: '';
            width: 85%;
            height: 2px;
            background-color: #ff3b30;
            box-shadow: 0 0 10px #ff3b30;
            position: absolute;
            animation: scanline 2.5s ease-in-out infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(-110px); }
            50% { transform: translateY(110px); }
            100% { transform: translateY(-110px); }
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        #barcode {
            width: 90%;
            max-height: 80%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 16px;
            color: #666666;
            text-align: center;
            padding: 10px;
        }
    </style>
    
    <!-- Подключение библиотек через CDN -->
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <!-- Стартовый экран -->
    <div id="start-screen">
        <h2>QR Сканер</h2>
        <p>Наведите камеру на QR-код.</p>
        <button id="start-button">Включить камеру</button>
        <div id="error-log"></div>
    </div>

    <!-- Контейнер камеры с прицелом -->
    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="aim-box"></div>
    </div>

    <!-- Контейнер результата -->
    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let stream = null;
        let isScanning = false;
        let currentDeviceId = null; // Для кэширования правильной камеры

        // Инициализация ZXing: только QR + режим TRY_HARDER для маленьких кодов
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true); 
        const codeReader = new ZXing.BrowserMultiFormatReader(hints);

        const videoElement = document.getElementById('video');
        const startScreen = document.getElementById('start-screen');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');
        const errorLog = document.getElementById('error-log');

        document.getElementById('start-button').addEventListener('click', () => {
            errorLog.innerText = ""; 
            startCamera();
        });

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                errorLog.innerText = "API камеры не поддерживается браузером.";
                return;
            }

            if (stream) stopCamera();

            try {
                // Если мы еще не определили лучшую камеру (исключаем Ultra Wide на iPhone)
                if (!currentDeviceId) {
                    // 1. Запрашиваем базовый доступ, чтобы iOS отдала названия устройств
                    let initStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    
                    // 2. Получаем список всех устройств
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoInputs = devices.filter(d => d.kind === 'videoinput');
                    
                    // 3. Фильтруем задние камеры
                    const backCameras = videoInputs.filter(d => 
                        d.label.toLowerCase().includes('back') || 
                        d.label.toLowerCase().includes('задн')
                    );

                    if (backCameras.length > 0) {
                        // Ищем основную камеру, игнорируя сверхширокоугольную (Ultra Wide), у которой нет макро-фокуса
                        const mainCamera = backCameras.find(d => 
                            !d.label.toLowerCase().includes('ultra') && 
                            !d.label.toLowerCase().includes('сверх')
                        );
                        currentDeviceId = mainCamera ? mainCamera.deviceId : backCameras[0].deviceId;
                    }

                    // Закрываем первичный поток
                    initStream.getTracks().forEach(track => track.stop());
                }

                // Формируем финальные настройки для камеры
                const constraints = {
                    video: currentDeviceId ? {
                        deviceId: { exact: currentDeviceId },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } : {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                // Запускаем камеру
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", true); 
                
                await videoElement.play();
                
                startScreen.style.display = 'none';
                scannerContainer.style.display = 'flex';
                
                applyAdvancedConstraints();

                isScanning = true;
                scanLoop();
            } catch (error) {
                console.error("Ошибка камеры:", error);
                errorLog.innerText = "Ошибка запуска камеры: " + error.message;
            }
        }

        function applyAdvancedConstraints() {
            try {
                const track = stream.getVideoTracks()[0];
                if (track && typeof track.getCapabilities === 'function') {
                    setTimeout(async () => {
                        try {
                            const capabilities = track.getCapabilities();
                            const advanced = {};
                            let shouldApply = false;

                            // Включаем непрерывный автофокус
                            if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                                advanced.focusMode = "continuous";
                                shouldApply = true;
                            }

                            // Включаем максимальный зум, как требовалось в задаче
                            if (capabilities.zoom && capabilities.zoom.max) {
                                advanced.zoom = capabilities.zoom.max;
                                shouldApply = true;
                            }

                            if (shouldApply) {
                                await track.applyConstraints({ advanced: [advanced] });
                            }
                        } catch (e) {
                            console.warn("Не удалось применить zoom/focus:", e);
                        }
                    }, 500);
                }
            } catch (err) {
                console.warn("Ошибка трека видео:", err);
            }
        }

        function stopCamera() {
            isScanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoElement.srcObject = null;
        }

        function scanLoop() {
            if (!isScanning) return;

            codeReader.decodeOnceFromVideoElement(videoElement)
                .then(result => {
                    const text = result.text;
                    const parts = text.split(';');
                    
                    // Проверяем соответствие нужному формату (минимум 2 части, разделенные ';')
                    if (parts.length >= 2) {
                        const extractedCode = parts[1]; // Достаем "4600721000523"
                        stopCamera();
                        showBarcodeResult(extractedCode);
                    } else {
                        // Если QR не того формата, продолжаем искать
                        setTimeout(scanLoop, 50);
                    }
                })
                .catch(err => {
                    if (isScanning) {
                        setTimeout(scanLoop, 50); // Уменьшил задержку для большей скорости считывания
                    }
                });
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            // Генерация штрихкода исключительно в SVG
            JsBarcode("#barcode", codeText, {
                format: "CODE128",
                displayValue: true,
                fontSize: 24,
                margin: 10,
                width: 3, 
                height: 150,
                background: "#ffffff",
                lineColor: "#000000"
            });
        }

        // Клик по экрану результата для возврата к сканеру
        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            document.getElementById('barcode').innerHTML = '';
            startCamera();
        });

        // Остановка камеры при скрытии страницы (чтобы не жрать батарею)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else {
                if (resultContainer.style.display !== 'flex' && startScreen.style.display === 'none') {
                    startCamera();
                }
            }
        });
    </script>
</body>
</html>
