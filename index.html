<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QR → Code128</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

#barcodeScreen{
    position:fixed;
    inset:0;
    display:none;
    background:#fff;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

#barcode{
    width:92vw;
    height:auto;
}

#hint{
    margin-top:20px;
    font-size:20px;
    color:#333;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<div id="barcodeScreen">
    <svg id="barcode"></svg>
    <div id="hint">Коснитесь экрана для нового сканирования</div>
</div>

<script>

const video = document.getElementById("video");
const barcodeScreen = document.getElementById("barcodeScreen");

let codeReader;
let stream;

async function startScanner(){

    barcodeScreen.style.display="none";

    if(stream){
        stream.getTracks().forEach(t=>t.stop());
    }

    codeReader = new ZXing.BrowserQRCodeReader();

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
    facingMode:{ideal:"environment"},
    width:{ideal:3840},
    height:{ideal:2160},
    focusMode:"continuous"
}
            },
            audio:false
        });

        video.srcObject = stream;

        codeReader.decodeFromVideoDevice(
            null,
            video,
            (result,err)=>{

                if(result){

                    codeReader.reset();

                    stream.getTracks().forEach(t=>t.stop());

                    processQR(result.getText());

                }

            });

    }catch(e){
        alert("Не удалось открыть камеру\n\n"+e);
    }

}

function processQR(text){

    const parts=text.trim().split(";");

    if(parts.length<2){
        alert("Неверный QR");
        startScanner();
        return;
    }

    const code=parts[1];

    JsBarcode("#barcode",code,{
        format:"CODE128",
        displayValue:true,
        fontSize:34,
        margin:20,
        height:220,
        width:4
    });

    barcodeScreen.style.display="flex";

}

barcodeScreen.addEventListener("click",()=>{
    startScanner();
});

window.addEventListener("load",()=>{
    startScanner();
});

</script>

</body>
</html>
