
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        #error-log {
            color: #ff4444;
            margin-top: 20px;
            font-size: 14px;
            max-width: 80%;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            display: none; /* Скрыто до нажатия кнопки */
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        #barcode {
            width: 90%;
            max-height: 80%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 16px;
            color: #666666;
            text-align: center;
            padding: 10px;
        }
    </style>
    
    <!-- Подключение библиотек через CDN -->
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <!-- Стартовый экран (требование iOS Safari для жеста пользователя) -->
    <div id="start-screen">
        <h2>QR Сканер</h2>
        <p>Для работы требуется доступ к камере.</p>
        <button id="start-button">Включить камеру</button>
        <div id="error-log"></div>
    </div>

    <!-- Контейнер камеры -->
    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
    </div>

    <!-- Контейнер результата -->
    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let stream = null;
        let isScanning = false;
        let codeReader = null;

        // Инициализация ZXing только для QR-кодов для ускорения распознавания
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
        codeReader = new ZXing.BrowserMultiFormatReader(hints);

        const videoElement = document.getElementById('video');
        const startScreen = document.getElementById('start-screen');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');
        const errorLog = document.getElementById('error-log');

        document.getElementById('start-button').addEventListener('click', () => {
            errorLog.innerText = ""; // Очищаем логи
            startCamera();
        });

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                errorLog.innerText = "Ошибка: Ваше устройство или браузер не поддерживает API камеры. Убедитесь, что сайт открыт по HTTPS.";
                return;
            }

            if (stream) {
                stopCamera();
            }

            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", true); 
                
                await videoElement.play();
                
                // Переключаем интерфейс
                startScreen.style.display = 'none';
                scannerContainer.style.display = 'flex';
                
                // Применение расширенных настроек камеры (Zoom и Фокус)
                applyAdvancedConstraints();

                isScanning = true;
                scanLoop();
            } catch (error) {
                console.error("Ошибка доступа к камере:", error);
                if (error.name === 'NotAllowedError') {
                    errorLog.innerText = "Доступ к камере запрещен. Разрешите доступ в настройках Safari.";
                } else if (window.location.protocol !== 'https:') {
                    errorLog.innerText = "Ошибка: Браузер блокирует камеру, так как сайт использует HTTP. Необходим HTTPS.";
                } else {
                    errorLog.innerText = "Не удалось запустить камеру: " + error.message;
                }
            }
        }

        function applyAdvancedConstraints() {
            try {
                const track = stream.getVideoTracks()[0];
                if (track && typeof track.getCapabilities === 'function') {
                    setTimeout(async () => {
                        try {
                            const capabilities = track.getCapabilities();
                            const advanced = {};
                            let shouldApply = false;

                            if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                                advanced.focusMode = "continuous";
                                shouldApply = true;
                            }

                            if (capabilities.zoom && capabilities.zoom.max) {
                                advanced.zoom = capabilities.zoom.max;
                                shouldApply = true;
                            }

                            if (shouldApply) {
                                await track.applyConstraints({ advanced: [advanced] });
                            }
                        } catch (e) {
                            console.warn("Не удалось применить расширенные настройки (zoom/focus):", e);
                        }
                    }, 500);
                }
            } catch (err) {
                console.warn("Ошибка при получении трека видео:", err);
            }
        }

        function stopCamera() {
            isScanning = false;
            if (stream) {
                stream.getTracks().forEach(track => {
                    track.stop();
                });
                stream = null;
            }
            videoElement.srcObject = null;
        }

        function scanLoop() {
            if (!isScanning) return;

            codeReader.decodeOnceFromVideoElement(videoElement)
                .then(result => {
                    const text = result.text;
                    const parts = text.split(';');
                    
                    if (parts.length >= 2) {
                        const extractedCode = parts[1];
                        stopCamera();
                        showBarcodeResult(extractedCode);
                    } else {
                        setTimeout(scanLoop, 100);
                    }
                })
                .catch(err => {
                    if (isScanning) {
                        setTimeout(scanLoop, 100); 
                    }
                });
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            JsBarcode("#barcode", codeText, {
                format: "CODE128",
                displayValue: true,
                fontSize: 24,
                margin: 10,
                width: 3, 
                height: 150,
                background: "#ffffff",
                lineColor: "#000000"
            });
        }

        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            document.getElementById('barcode').innerHTML = '';
            // Перезапускаем камеру сразу по тапу (жест пользователя есть, проблем не будет)
            startCamera();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else {
                if (resultContainer.style.display !== 'flex' && startScreen.style.display === 'none') {
                    startCamera();
                }
            }
        });
    </script>
</body>
</html>
