<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #error-log {
            color: #ff4444;
            margin-top: 20px;
            font-size: 14px;
            max-width: 90%;
            word-wrap: break-word;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Визуальная рамка-прицел */
        #aim-box {
            width: 260px;
            height: 260px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            position: absolute;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #aim-box::after {
            content: '';
            width: 85%;
            height: 2px;
            background-color: #ff3b30;
            box-shadow: 0 0 10px #ff3b30;
            position: absolute;
            animation: scanline 2.5s ease-in-out infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(-110px); }
            50% { transform: translateY(110px); }
            100% { transform: translateY(-110px); }
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        #barcode {
            width: 90%;
            max-height: 70%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 16px;
            color: #666666;
            text-align: center;
            padding: 10px;
            word-wrap: break-word;
            max-width: 100%;
        }
    </style>
    
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h2>QR Сканер</h2>
        <p>Наведите камеру на QR-код.</p>
        <button id="start-button">Включить камеру</button>
        <div id="error-log"></div>
    </div>

    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="aim-box"></div>
    </div>

    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let stream = null;
        let isScanning = false;
        let currentDeviceId = null;

        // Инициализация ZXing
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true); // Включаем обратно для сложных QR
        const codeReader = new ZXing.BrowserMultiFormatReader(hints);

        const videoElement = document.getElementById('video');
        const startScreen = document.getElementById('start-screen');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');
        const errorLog = document.getElementById('error-log');
        const instructionText = document.getElementById('instruction');

        document.getElementById('start-button').addEventListener('click', () => {
            errorLog.innerText = ""; 
            startCamera();
        });

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                errorLog.innerText = "API камеры не поддерживается браузером.";
                return;
            }

            if (stream) stopCamera();

            try {
                // Поиск правильной камеры (без Ultra Wide)
                if (!currentDeviceId) {
                    let initStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoInputs = devices.filter(d => d.kind === 'videoinput');
                    
                    const backCameras = videoInputs.filter(d => 
                        d.label.toLowerCase().includes('back') || 
                        d.label.toLowerCase().includes('задн') ||
                        d.label.toLowerCase().includes('environment')
                    );

                    if (backCameras.length > 0) {
                        const mainCamera = backCameras.find(d => 
                            !d.label.toLowerCase().includes('ultra') && 
                            !d.label.toLowerCase().includes('сверх') &&
                            !d.label.toLowerCase().includes('tele')
                        );
                        currentDeviceId = mainCamera ? mainCamera.deviceId : backCameras[0].deviceId;
                    }
                    initStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: currentDeviceId ? {
                        deviceId: { exact: currentDeviceId },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } : {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", true); 
                
                await videoElement.play();
                
                startScreen.style.display = 'none';
                scannerContainer.style.display = 'flex';
                
                // РЕШЕНИЕ БАГА IOS: Ждем, пока браузер не отдаст реальные пиксели видео
                const waitForDimensions = () => {
                    if (videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
                        // Размеры готовы, теперь можно применять зум и запускать сканер
                        applyAdvancedConstraints();
                        isScanning = true;
                        scanLoop(); 
                    } else {
                        requestAnimationFrame(waitForDimensions);
                    }
                };
                waitForDimensions();

            } catch (error) {
                console.error("Ошибка камеры:", error);
                errorLog.innerText = "Ошибка запуска камеры: " + error.message;
            }
        }

        function applyAdvancedConstraints() {
            try {
                const track = stream.getVideoTracks()[0];
                if (track && typeof track.getCapabilities === 'function') {
                    setTimeout(async () => {
                        try {
                            const capabilities = track.getCapabilities();
                            const advanced = {};
                            let shouldApply = false;

                            if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                                advanced.focusMode = "continuous";
                                shouldApply = true;
                            }

                            if (capabilities.zoom && capabilities.zoom.max) {
                                advanced.zoom = capabilities.zoom.max;
                                shouldApply = true;
                            }

                            if (shouldApply) {
                                await track.applyConstraints({ advanced: [advanced] });
                            }
                        } catch (e) {
                            console.warn("Не удалось применить zoom/focus:", e);
                        }
                    }, 500);
                }
            } catch (err) {
                console.warn("Ошибка трека видео:", err);
            }
        }

        function stopCamera() {
            isScanning = false;
            if (codeReader) {
                codeReader.reset(); // Очищаем кэш канвасов ZXing
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoElement.srcObject = null;
        }

        function scanLoop() {
            if (!isScanning) return;

            codeReader.decodeOnceFromVideoElement(videoElement)
                .then(result => {
                    const text = result.text;
                    let extractedCode = text; 

                    // Разбираем строку CEN;4600721000523;88.89;1;6;23.07.26
                    if (text.includes(';')) {
                        const parts = text.split(';');
                        if (parts.length >= 2) {
                            extractedCode = parts[1];
                        }
                    }

                    stopCamera();
                    showBarcodeResult(extractedCode);
                })
                .catch(err => {
                    if (isScanning) {
                        // Задержка 100мс между кадрами, чтобы не перегревать процессор iPhone
                        setTimeout(() => requestAnimationFrame(scanLoop), 100); 
                    }
                });
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            try {
                JsBarcode("#barcode", codeText, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 24,
                    margin: 10,
                    width: 3, 
                    height: 150,
                    background: "#ffffff",
                    lineColor: "#000000"
                });
            } catch (e) {
                document.getElementById('barcode').innerHTML = '';
                instructionText.innerText = "Ошибка генерации штрихкода.\nСчитанный текст: " + codeText + "\n\nКоснитесь для нового сканирования.";
                instructionText.style.color = "#ff3b30";
                instructionText.style.fontWeight = "bold";
            }
        }

        // Возврат к камере по клику
        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            document.getElementById('barcode').innerHTML = '';
            
            instructionText.innerText = 'Коснитесь экрана для нового сканирования';
            instructionText.style.color = '#666666';
            instructionText.style.fontWeight = "normal";
            
            startCamera();
        });

        // Пауза при сворачивании Safari
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else {
                if (resultContainer.style.display !== 'flex' && startScreen.style.display === 'none') {
                    startCamera();
                }
            }
        });
    </script>
</body>
</html>
