<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #error-log {
            color: #ff4444;
            margin-top: 20px;
            font-size: 14px;
            max-width: 90%;
            word-wrap: break-word;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Прицел */
        #aim-box {
            width: 260px;
            height: 260px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            position: absolute;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #aim-box::after {
            content: '';
            width: 85%;
            height: 2px;
            background-color: #34c759;
            box-shadow: 0 0 10px #34c759;
            position: absolute;
            animation: scanline 2.5s ease-in-out infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(-110px); }
            50% { transform: translateY(110px); }
            100% { transform: translateY(-110px); }
        }

        #ui-controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #switch-camera-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            display: none; 
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        #barcode {
            width: 90%;
            max-height: 70%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 16px;
            color: #666666;
            text-align: center;
            padding: 10px;
            word-wrap: break-word;
            max-width: 100%;
        }
    </style>
    
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h2>QR Сканер</h2>
        <p>Разрешите доступ к камере</p>
        <button id="start-button">Включить камеру</button>
        <div id="error-log"></div>
    </div>

    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="aim-box"></div>
        <div id="ui-controls">
            <button id="switch-camera-btn">🔄 Сменить камеру</button>
        </div>
    </div>

    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let videoDevices = [];
        let currentDeviceIndex = 0;
        
        // Жесткие настройки ZXing для сложных/цветных фонов
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true); 
        
        const codeReader = new ZXing.BrowserMultiFormatReader(hints);

        const videoElement = document.getElementById('video');
        const startScreen = document.getElementById('start-screen');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');
        const errorLog = document.getElementById('error-log');
        const instructionText = document.getElementById('instruction');
        const switchBtn = document.getElementById('switch-camera-btn');

        document.getElementById('start-button').addEventListener('click', async () => {
            errorLog.innerText = ""; 
            await initCameras();
            startScanner();
        });

        switchBtn.addEventListener('click', () => {
            if (videoDevices.length > 1) {
                currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
                codeReader.reset(); // Останавливаем текущий поток
                startScanner(); // Перезапускаем с новой камерой
            }
        });

        async function initCameras() {
            try {
                let initStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const devices = await navigator.mediaDevices.enumerateDevices();
                
                videoDevices = devices.filter(device => 
                    device.kind === 'videoinput' && 
                    (!device.label.toLowerCase().includes('front') && !device.label.toLowerCase().includes('передн'))
                );

                if (videoDevices.length > 1) {
                    switchBtn.style.display = 'block';
                }
                
                // Ищем основную камеру (отсекаем Ultra Wide и Telephoto, если возможно)
                let bestCameraIndex = videoDevices.findIndex(d => 
                    !d.label.toLowerCase().includes('ultra') && 
                    !d.label.toLowerCase().includes('сверх') &&
                    !d.label.toLowerCase().includes('tele')
                );
                
                if (bestCameraIndex !== -1) {
                    currentDeviceIndex = bestCameraIndex;
                }

                initStream.getTracks().forEach(track => track.stop());
            } catch (err) {
                console.warn("Ошибка перечисления камер:", err);
            }
        }

        function startScanner() {
            startScreen.style.display = 'none';
            scannerContainer.style.display = 'flex';
            
            let deviceId = videoDevices.length > 0 ? videoDevices[currentDeviceIndex].deviceId : undefined;

            // Нативный метод ZXing: сам захватывает видео, сам крутит цикл сканирования
            codeReader.decodeFromVideoDevice(deviceId, videoElement, (result, err) => {
                if (result) {
                    const text = result.text;
                    let extractedCode = text; 

                    // Парсим строку вида: CEN;4600721000523;88.89;1;6;23.07.26
                    if (text.includes(';')) {
                        const parts = text.split(';');
                        if (parts.length >= 2) {
                            extractedCode = parts[1]; // Достаем 4600721000523
                        }
                    }

                    // При успешном сканировании останавливаем ридер
                    codeReader.reset();
                    showBarcodeResult(extractedCode);
                }
                // Ошибки NotFoundException игнорируются, так как сканер продолжает искать
            }).then(() => {
                // Вызывается после того, как камера успешно запустилась.
                // Применяем продвинутые настройки к потоку, который создал ZXing.
                setTimeout(applyAdvancedConstraints, 1000);
            }).catch(err => {
                console.error(err);
                errorLog.innerText = "Ошибка запуска сканера: " + err.message;
                startScreen.style.display = 'flex';
                scannerContainer.style.display = 'none';
            });
        }

        function applyAdvancedConstraints() {
            try {
                if (!videoElement.srcObject) return;
                const track = videoElement.srcObject.getVideoTracks()[0];
                if (track && typeof track.getCapabilities === 'function') {
                    const capabilities = track.getCapabilities();
                    const advanced = {};
                    
                    if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                        advanced.focusMode = "continuous";
                    }
                    if (capabilities.zoom && capabilities.zoom.max) {
                        // Не ставим на самый максимум, чтобы не размывать, но зумируем
                        advanced.zoom = capabilities.zoom.max > 2 ? 2 : capabilities.zoom.max;
                    }
                    
                    if (Object.keys(advanced).length > 0) {
                        track.applyConstraints({ advanced: [advanced] }).catch(e => console.warn(e));
                    }
                }
            } catch (err) {
                console.warn(err);
            }
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            try {
                JsBarcode("#barcode", codeText, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 24,
                    margin: 10,
                    width: 3, 
                    height: 150,
                    background: "#ffffff",
                    lineColor: "#000000"
                });
            } catch (e) {
                document.getElementById('barcode').innerHTML = '';
                instructionText.innerText = "Ошибка генерации Code128.\nСчитанный текст: " + codeText + "\n\nКоснитесь для нового сканирования.";
                instructionText.style.color = "#ff3b30";
                instructionText.style.fontWeight = "bold";
            }
        }

        // Возврат к камере по клику
        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            document.getElementById('barcode').innerHTML = '';
            
            instructionText.innerText = 'Коснитесь экрана для нового сканирования';
            instructionText.style.color = '#666666';
            instructionText.style.fontWeight = "normal";
            
            startScanner();
        });

        // Пауза при сворачивании Safari (освобождаем камеру)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                codeReader.reset();
            } else {
                if (resultContainer.style.display !== 'flex' && startScreen.style.display === 'none') {
                    startScanner();
                }
            }
        });
    </script>
</body>
</html>
