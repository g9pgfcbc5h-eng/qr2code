<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background-color: #34c759;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        #start-button:active {
            transform: scale(0.96);
        }

        #error-log {
            color: #ff3b30;
            margin-top: 20px;
            font-size: 14px;
            max-width: 90%;
            word-wrap: break-word;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Минималистичная подсказка вместо жесткой рамки */
        #scan-hint {
            position: absolute;
            top: 60px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: center;
            pointer-events: none;
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        #barcode {
            width: 90%;
            max-height: 75%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 15px;
            color: #666666;
            text-align: center;
        }
    </style>
    
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h2 style="margin-bottom: 8px;">QR Сканер</h2>
        <p style="color: #aaa; margin: 0;">Сканирует QR-коды с любого расстояния</p>
        <button id="start-button">Включить камеру</button>
        <div id="error-log"></div>
    </div>

    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="scan-hint">Наведите камеру на QR-код</div>
    </div>

    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let stream = null;
        let isScanning = false;
        let nativeBarcodeDetector = null;

        // Инициализация нативного сканера Apple Vision (если поддерживается iOS)
        if ('BarcodeDetector' in window) {
            try {
                nativeBarcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            } catch (e) {
                console.log("BarcodeDetector fallback to ZXing");
            }
        }

        // Запасной ридер ZXing
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        const zxingReader = new ZXing.BrowserQRCodeReader(hints);

        const videoElement = document.getElementById('video');
        const startScreen = document.getElementById('start-screen');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');
        const errorLog = document.getElementById('error-log');
        const instructionText = document.getElementById('instruction');

        document.getElementById('start-button').addEventListener('click', () => {
            errorLog.innerText = "";
            startCamera();
        });

        async function startCamera() {
            if (stream) stopCamera();

            // Простой и надежный запрос к задней камере в Full HD
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", "true");

                await videoElement.play();

                startScreen.style.display = 'none';
                scannerContainer.style.display = 'flex';

                isScanning = true;
                scanLoop();

            } catch (error) {
                console.error("Ошибка запуска камеры:", error);
                errorLog.innerText = "Не удалось открыть камеру: " + (error.message || error.name);
                startScreen.style.display = 'flex';
                scannerContainer.style.display = 'none';
            }
        }

        function stopCamera() {
            isScanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoElement.srcObject = null;
        }

        async function scanLoop() {
            if (!isScanning) return;

            // 1. Попытка нативного сканирования (быстрое, с любого угла и расстояния)
            if (nativeBarcodeDetector) {
                try {
                    const barcodes = await nativeBarcodeDetector.detect(videoElement);
                    if (barcodes.length > 0 && isScanning) {
                        handleCodeFound(barcodes[0].rawValue);
                        return;
                    }
                } catch (e) {}
            }

            // 2. Запасной вариант через ZXing
            try {
                const result = await zxingReader.decodeOnceFromVideoElement(videoElement);
                if (result && isScanning) {
                    handleCodeFound(result.text);
                    return;
                }
            } catch (err) {}

            // Продолжаем цикл сканирования
            if (isScanning) {
                requestAnimationFrame(scanLoop);
            }
        }

        function handleCodeFound(rawText) {
            let extractedCode = rawText;

            // Извлечение кода из CEN;4600721000523;88.89;1;6;23.07.26
            if (rawText.includes(';')) {
                const parts = rawText.split(';');
                if (parts.length >= 2) {
                    extractedCode = parts[1];
                }
            }

            stopCamera();
            showBarcodeResult(extractedCode);
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            try {
                JsBarcode("#barcode", codeText, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 22,
                    margin: 10,
                    width: 3,
                    height: 140,
                    background: "#ffffff",
                    lineColor: "#000000"
                });
            } catch (e) {
                document.getElementById('barcode').innerHTML = '';
                instructionText.innerText = "Ошибка генерации Code128.\nСчитанный текст: " + codeText + "\n\nКоснитесь для нового сканирования.";
                instructionText.style.color = "#ff3b30";
                instructionText.style.fontWeight = "bold";
            }
        }

        // Повторный запуск по тапу
        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            document.getElementById('barcode').innerHTML = '';

            instructionText.innerText = 'Коснитесь экрана для нового сканирования';
            instructionText.style.color = '#666666';
            instructionText.style.fontWeight = "normal";

            startCamera();
        });

        // Пауза при сворачивании Safari
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else {
                if (resultContainer.style.display !== 'flex' && startScreen.style.display === 'none') {
                    startCamera();
                }
            }
        });
    </script>
</body>
</html>
