<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR → Code128</title>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation;
}

#cameraView{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

#barcodeView{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#fff;
    cursor:pointer;
}

#barcodeSvg{
    width:96vw;
    height:auto;
}

#hint{
    margin-top:24px;
    color:#444;
    font-size:16px;
    text-align:center;
}
</style>
</head>

<body>

<video
    id="cameraView"
    autoplay
    muted
    playsinline
></video>

<div id="barcodeView">

<svg id="barcodeSvg"></svg>

<div id="hint">
Коснитесь экрана для нового сканирования
</div>

</div>

<script>

const video=document.getElementById("cameraView");
const barcodeView=document.getElementById("barcodeView");
const barcodeSvg=document.getElementById("barcodeSvg");

let codeReader=null;
let mediaStream=null;
let currentDeviceId=null;
let scanning=false;

const hints=new Map();

hints.set(
ZXing.DecodeHintType.POSSIBLE_FORMATS,
[
ZXing.BarcodeFormat.QR_CODE
]
);

codeReader=new ZXing.BrowserMultiFormatReader(hints);

async function stopCamera(){

scanning=false;

try{

codeReader.reset();

}catch(e){}

if(mediaStream){

mediaStream.getTracks().forEach(track=>{

try{
track.stop();
}catch(e){}

});

mediaStream=null;

}

video.srcObject=null;

}
    async function applyCameraSettings(track){

    try{

        const capabilities=track.getCapabilities
            ?track.getCapabilities()
            :null;

        if(!capabilities){
            return;
        }

        const advanced=[];

        if(capabilities.focusMode){

            if(
                Array.isArray(capabilities.focusMode) &&
                capabilities.focusMode.includes("continuous")
            ){

                advanced.push({
                    focusMode:"continuous"
                });

            }

        }

        if(capabilities.zoom){

            try{

                const maxZoom=capabilities.zoom.max;

                if(typeof maxZoom==="number"){

                    advanced.push({
                        zoom:maxZoom
                    });

                }

            }catch(e){}

        }

        if(advanced.length){

            try{

                await track.applyConstraints({
                    advanced:advanced
                });

            }catch(e){}

        }

    }catch(e){}

}

async function startCamera(){

    await stopCamera();

    barcodeView.style.display="none";

    video.style.display="block";

    scanning=true;

    let stream=null;

    try{

        stream=await navigator.mediaDevices.getUserMedia({

            audio:false,

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                }

            }

        });

    }catch(firstError){

        try{

            stream=await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{
                    facingMode:"environment"
                }

            });

        }catch(secondError){

            alert("Не удалось открыть заднюю камеру.");

            return;

        }

    }

    mediaStream=stream;

    video.srcObject=stream;

    await video.play();

    const track=stream.getVideoTracks()[0];

    if(track){

        currentDeviceId=track.getSettings().deviceId||null;

        await applyCameraSettings(track);

    }

    scanLoop();

}

async function scanLoop(){

    while(scanning){

        try{

            const result=await codeReader.decodeOnceFromVideoElement(video);

            if(result){

                await onQrDetected(result.getText());

                return;

            }

        }catch(e){

            if(
                e instanceof ZXing.NotFoundException
            ){

            }else{

                await new Promise(resolve=>setTimeout(resolve,100));

            }

        }

    }

}
   async function onQrDetected(text){

    scanning=false;

    await stopCamera();

    const parts=text.split(";");

    if(parts.length<2){

        alert("Неверный формат QR-кода.");

        await startCamera();

        return;

    }

    const code128Value=parts[1].trim();

    if(!code128Value){

        alert("Не удалось извлечь код.");

        await startCamera();

        return;

    }

    try{

        JsBarcode(
            "#barcodeSvg",
            code128Value,
            {
                format:"CODE128",
                width:4,
                height:240,
                margin:20,
                displayValue:true,
                fontSize:42,
                textMargin:12,
                background:"#ffffff",
                lineColor:"#000000"
            }
        );

    }catch(e){

        alert("Ошибка генерации штрихкода.");

        await startCamera();

        return;

    }

    video.style.display="none";

    barcodeView.style.display="flex";

}

barcodeView.addEventListener("click",async()=>{

    if(scanning){
        return;
    }

    barcodeView.style.display="none";

    await startCamera();

});

window.addEventListener("pageshow",async()=>{

    try{

        await startCamera();

    }catch(e){

        console.error(e);

    }

});

window.addEventListener("beforeunload",async()=>{

    await stopCamera();

});

document.addEventListener("visibilitychange",async()=>{

    if(document.hidden){

        await stopCamera();

    }

});
    window.addEventListener("pagehide",async()=>{

    await stopCamera();

});

window.addEventListener("focus",async()=>{

    if(
        !document.hidden &&
        !scanning &&
        barcodeView.style.display!=="flex"
    ){

        try{

            await startCamera();

        }catch(e){

            console.error(e);

        }

    }

});

if(
    navigator.mediaDevices &&
    navigator.mediaDevices.getUserMedia
){

    startCamera().catch(function(error){

        console.error(error);

        alert("Не удалось получить доступ к камере.");

    });

}else{

    alert("Ваш браузер не поддерживает MediaDevices API.");

}

</script>

</body>
</html>
