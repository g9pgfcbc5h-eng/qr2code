<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        #barcode {
            width: 90%;
            max-height: 80%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 16px;
            color: #666666;
            text-align: center;
            padding: 10px;
        }
    </style>
    
    <!-- Подключение библиотек через CDN -->
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <!-- Контейнер камеры -->
    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
    </div>

    <!-- Контейнер результата -->
    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let stream = null;
        let isScanning = false;
        let codeReader = null;

        // Инициализация ZXing только для QR-кодов для ускорения распознавания
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
        codeReader = new ZXing.BrowserMultiFormatReader(hints);

        const videoElement = document.getElementById('video');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');

        async function startCamera() {
            if (stream) {
                stopCamera();
            }

            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", true); 
                
                await videoElement.play();
                
                // Применение расширенных настроек камеры (Zoom и Фокус)
                applyAdvancedConstraints();

                isScanning = true;
                scanLoop();
            } catch (error) {
                console.error("Ошибка доступа к камере:", error);
                alert("Не удалось получить доступ к камере. Проверьте разрешения.");
            }
        }

        function applyAdvancedConstraints() {
            try {
                const track = stream.getVideoTracks()[0];
                if (track && typeof track.getCapabilities === 'function') {
                    // Небольшая задержка, чтобы iOS Safari успел загрузить возможности камеры
                    setTimeout(async () => {
                        try {
                            const capabilities = track.getCapabilities();
                            const advanced = {};
                            let shouldApply = false;

                            // Непрерывный автофокус
                            if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                                advanced.focusMode = "continuous";
                                shouldApply = true;
                            }

                            // Максимальный зум
                            if (capabilities.zoom && capabilities.zoom.max) {
                                advanced.zoom = capabilities.zoom.max;
                                shouldApply = true;
                            }

                            if (shouldApply) {
                                await track.applyConstraints({ advanced: [advanced] });
                                console.log("Применены расширенные настройки камеры:", advanced);
                            }
                        } catch (e) {
                            console.warn("Не удалось применить расширенные настройки (zoom/focus):", e);
                        }
                    }, 500);
                }
            } catch (err) {
                console.warn("Ошибка при получении трека видео:", err);
            }
        }

        function stopCamera() {
            isScanning = false;
            if (stream) {
                stream.getTracks().forEach(track => {
                    track.stop();
                });
                stream = null;
            }
            videoElement.srcObject = null;
        }

        function scanLoop() {
            if (!isScanning) return;

            codeReader.decodeOnceFromVideoElement(videoElement)
                .then(result => {
                    const text = result.text;
                    const parts = text.split(';');
                    
                    // Проверка формата (ожидаем минимум 2 поля)
                    if (parts.length >= 2) {
                        const extractedCode = parts[1]; // Берем второе поле
                        stopCamera();
                        showBarcodeResult(extractedCode);
                    } else {
                        // Если QR не того формата, продолжаем искать
                        setTimeout(scanLoop, 100);
                    }
                })
                .catch(err => {
                    // Игнорируем ошибку NotFoundException (когда штрихкод не найден в текущем кадре)
                    if (err && err.name !== 'NotFoundException') {
                        console.warn("Ошибка декодирования:", err);
                    }
                    if (isScanning) {
                        setTimeout(scanLoop, 100); // 10 FPS для экономии батареи и стабильной работы
                    }
                });
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            // Генерация Code128 в SVG через JsBarcode
            JsBarcode("#barcode", codeText, {
                format: "CODE128",
                displayValue: true,
                fontSize: 24,
                margin: 10,
                width: 3, 
                height: 150,
                background: "#ffffff",
                lineColor: "#000000"
            });
        }

        // Обработка тапа по результату для нового сканирования
        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            scannerContainer.style.display = 'flex';
            
            // Очистка предыдущего штрихкода (необязательно, но полезно)
            document.getElementById('barcode').innerHTML = '';
            
            startCamera();
        });

        // Запуск камеры при загрузке страницы
        window.addEventListener('load', () => {
            startCamera();
        });

        // Корректное освобождение камеры при закрытии/скрытии вкладки
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else {
                if (resultContainer.style.display !== 'flex') {
                    startCamera();
                }
            }
        });
    </script>
</body>
</html>
