<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner to Code128</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background-color: #34c759;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
            transition: transform 0.1s ease;
        }

        #start-button:active {
            transform: scale(0.96);
        }

        #error-log {
            color: #ff3b30;
            margin-top: 20px;
            font-size: 14px;
            max-width: 90%;
            word-wrap: break-word;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #aim-box {
            width: 250px;
            height: 250px;
            border: 2.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
            position: absolute;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #aim-box::after {
            content: '';
            width: 85%;
            height: 2px;
            background-color: #30d158;
            box-shadow: 0 0 12px #30d158;
            position: absolute;
            animation: scanline 2.2s ease-in-out infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(-100px); }
            50% { transform: translateY(100px); }
            100% { transform: translateY(-100px); }
        }

        #ui-controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }

        #result-container {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        #barcode {
            width: 90%;
            max-height: 75%;
        }

        #instruction {
            margin-top: 30px;
            font-size: 15px;
            color: #666666;
            text-align: center;
        }
    </style>
    
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h2 style="margin-bottom: 8px;">QR Сканер</h2>
        <p style="color: #aaa; margin: 0;">Нажмите для запуска камеры</p>
        <button id="start-button">Включить камеру</button>
        <div id="error-log"></div>
    </div>

    <div id="scanner-container">
        <video id="video" playsinline autoplay muted></video>
        <div id="aim-box"></div>
        <div id="ui-controls">
            <button id="switch-camera-btn" class="action-btn" style="display: none;">🔄 Сменить камеру</button>
        </div>
    </div>

    <div id="result-container">
        <svg id="barcode"></svg>
        <div id="instruction">Коснитесь экрана для нового сканирования</div>
    </div>

    <script>
        let stream = null;
        let isScanning = false;
        let videoDevices = [];
        let currentDeviceIndex = 0;

        // Использование профильного QRCodeReader для мгновенного отклика
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        const codeReader = new ZXing.BrowserQRCodeReader(hints);

        const videoElement = document.getElementById('video');
        const startScreen = document.getElementById('start-screen');
        const scannerContainer = document.getElementById('scanner-container');
        const resultContainer = document.getElementById('result-container');
        const errorLog = document.getElementById('error-log');
        const instructionText = document.getElementById('instruction');
        const switchBtn = document.getElementById('switch-camera-btn');

        document.getElementById('start-button').addEventListener('click', async () => {
            errorLog.innerText = "";
            await initCameras();
            startScanner();
        });

        switchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (videoDevices.length > 1) {
                currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
                stopCamera();
                startScanner();
            }
        });

        async function initCameras() {
            try {
                let initStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const devices = await navigator.mediaDevices.enumerateDevices();
                
                videoDevices = devices.filter(d => 
                    d.kind === 'videoinput' && 
                    !d.label.toLowerCase().includes('front') && 
                    !d.label.toLowerCase().includes('передн')
                );

                if (videoDevices.length > 1) {
                    switchBtn.style.display = 'block';
                }

                // Выбираем основную камеру (не ширик и не телевик)
                let mainCamIndex = videoDevices.findIndex(d => 
                    !d.label.toLowerCase().includes('ultra') && 
                    !d.label.toLowerCase().includes('сверх') &&
                    !d.label.toLowerCase().includes('tele')
                );

                if (mainCamIndex !== -1) {
                    currentDeviceIndex = mainCamIndex;
                }

                initStream.getTracks().forEach(t => t.stop());
            } catch (err) {
                console.warn("Ошибка поиска камер:", err);
            }
        }

        async function startScanner() {
            if (stream) stopCamera();

            let videoConstraint = {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            };

            if (videoDevices.length > 0 && videoDevices[currentDeviceIndex]) {
                videoConstraint = {
                    deviceId: { exact: videoDevices[currentDeviceIndex].deviceId },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                };
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint });
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", "true");

                await videoElement.play();

                startScreen.style.display = 'none';
                scannerContainer.style.display = 'flex';

                await applyOptimalCameraConstraints();

                isScanning = true;
                scanLoop();

            } catch (error) {
                console.error("Ошибка запуска:", error);
                errorLog.innerText = "Не удалось открыть камеру: " + error.message;
                startScreen.style.display = 'flex';
                scannerContainer.style.display = 'none';
            }
        }

        async function applyOptimalCameraConstraints() {
            try {
                if (!stream) return;
                const track = stream.getVideoTracks()[0];
                if (!track || typeof track.getCapabilities !== 'function') return;

                const capabilities = track.getCapabilities();
                const advanced = {};
                let hasChanges = false;

                // Включаем постоянную фокусировку
                if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                    advanced.focusMode = "continuous";
                    hasChanges = true;
                }

                // Аккуратный оптический/цифровой зум до 2.0x без мыла и потери фокуса
                if (capabilities.zoom) {
                    const targetZoom = Math.min(capabilities.zoom.max, 2.0);
                    if (targetZoom > (capabilities.zoom.min || 1)) {
                        advanced.zoom = targetZoom;
                        hasChanges = true;
                    }
                }

                if (hasChanges) {
                    await track.applyConstraints({ advanced: [advanced] });
                }
            } catch (e) {
                console.warn("Ошибка применимости constraints:", e);
            }
        }

        function stopCamera() {
            isScanning = false;
            if (codeReader) {
                codeReader.reset();
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoElement.srcObject = null;
        }

        function scanLoop() {
            if (!isScanning) return;

            codeReader.decodeOnceFromVideoElement(videoElement)
                .then(result => {
                    if (!isScanning) return;
                    const text = result.text;
                    let extractedCode = text;

                    // Извлечение второго поля из CEN;4600721000523;88.89;1;6;23.07.26
                    if (text.includes(';')) {
                        const parts = text.split(';');
                        if (parts.length >= 2) {
                            extractedCode = parts[1];
                        }
                    }

                    stopCamera();
                    showBarcodeResult(extractedCode);
                })
                .catch(err => {
                    if (isScanning) {
                        setTimeout(scanLoop, 80);
                    }
                });
        }

        function showBarcodeResult(codeText) {
            scannerContainer.style.display = 'none';
            resultContainer.style.display = 'flex';

            try {
                JsBarcode("#barcode", codeText, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 22,
                    margin: 10,
                    width: 3,
                    height: 140,
                    background: "#ffffff",
                    lineColor: "#000000"
                });
            } catch (e) {
                document.getElementById('barcode').innerHTML = '';
                instructionText.innerText = "Ошибка генерации Code128.\nСчитанный текст: " + codeText + "\n\nКоснитесь для нового сканирования.";
                instructionText.style.color = "#ff3b30";
                instructionText.style.fontWeight = "bold";
            }
        }

        // Повторный запуск по тапу на экран результата
        resultContainer.addEventListener('click', () => {
            resultContainer.style.display = 'none';
            document.getElementById('barcode').innerHTML = '';

            instructionText.innerText = 'Коснитесь экрана для нового сканирования';
            instructionText.style.color = '#666666';
            instructionText.style.fontWeight = "normal";

            startScanner();
        });

        // Тап по области сканера повторно запрашивает фокусировку
        scannerContainer.addEventListener('click', (e) => {
            if (e.target.id === 'switch-camera-btn') return;
            applyOptimalCameraConstraints();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else {
                if (resultContainer.style.display !== 'flex' && startScreen.style.display === 'none') {
                    startScanner();
                }
            }
        });
    </script>
</body>
</html>
