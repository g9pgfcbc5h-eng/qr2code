<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QR2Code</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial;
}

#reader{
width:100vw;
height:100vh;
}

#barcodeScreen{

display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:white;

justify-content:center;
align-items:center;
flex-direction:column;

}

svg{

width:95%;
height:250px;

}

#number{

font-size:40px;
font-weight:bold;
margin-top:20px;

}

</style>

</head>

<body>

<div id="reader"></div>

<div id="barcodeScreen">

<svg id="barcode"></svg>

<div id="number"></div>

</div>

<script>

const reader=document.getElementById("reader");
const barcodeScreen=document.getElementById("barcodeScreen");
const number=document.getElementById("number");

let scanner=new Html5Qrcode("reader");

function showBarcode(code){

reader.style.display="none";

barcodeScreen.style.display="flex";

JsBarcode("#barcode",code,{
format:"CODE128",
displayValue:false,
margin:10
});

number.innerText=code;

}

function back(){

barcodeScreen.style.display="none";

reader.style.display="block";

startScanner();

}

barcodeScreen.onclick=back;

function startScanner(){

scanner.start(

{facingMode:"environment"},

{

fps:15,

qrbox:250

},

(text)=>{

scanner.stop();

let parts=text.split(";");

if(parts.length>1){

showBarcode(parts[1]);

}

}

);

}

startScanner();

</script>

</body>

</html>
