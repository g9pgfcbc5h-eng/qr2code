<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QR2Code</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

#reader{
width:100vw;
height:100vh;
}

#result{

display:none;

position:fixed;
left:0;
top:0;

width:100%;
height:100%;

background:white;

justify-content:center;
align-items:center;
flex-direction:column;

}

svg{

width:95%;
height:220px;

}

#text{

font-size:42px;
font-weight:bold;

margin-top:25px;

}

</style>

</head>

<body>

<div id="reader"></div>

<div id="result">

<svg id="barcode"></svg>

<div id="text"></div>

</div>

<script>
  const result=document.getElementById("result");
const text=document.getElementById("text");

const scanner=new Html5Qrcode("reader");

let busy=false;

function showBarcode(code){

busy=true;

document.getElementById("reader").style.display="none";
result.style.display="flex";

JsBarcode("#barcode",code,{
format:"CODE128",
displayValue:false,
margin:10,
height:140
});

text.innerText=code;

}

result.onclick=()=>{

result.style.display="none";

document.getElementById("reader").style.display="block";

busy=false;

start();

};

function start(){

scanner.start(

{facingMode:"environment"},

{
fps:20,
qrbox:{width:250,height:250}
},

(decoded)=>{

if(busy)return;

const parts=decoded.split(";");

if(parts.length>=2){

scanner.stop().then(()=>{

showBarcode(parts[1]);

});

}

},

()=>{}

);

}

start();
  </script>

</body>
</html>
